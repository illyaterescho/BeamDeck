name: BeamDeck
options:
  bundleIdPrefix: ua.beamdeck
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "12"
    DEVELOPMENT_TEAM: ""
    # One place for the app id; the widget extension derives its own from it.
    BEAMDECK_BUNDLE_ID: ua.beamdeck.remote
targets:
  BeamDeck:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [BeamDeck]
    dependencies:
      - target: BeamDeckWidgets
        embed: true
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BEAMDECK_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BeamDeck
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "BeamDeck знаходить проєктор поруч і керує ним через Bluetooth."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ENABLE_APP_SANDBOX: YES
        ENABLE_RESOURCE_ACCESS_BLUETOOTH: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: BeamDeck/Info.plist
      properties:
        NSMicrophoneUsageDescription: "BeamDeck слухає голосові команди, лише поки ви утримуєте кнопку мікрофона."
        NSSpeechRecognitionUsageDescription: "BeamDeck розпізнає українські голосові команди для керування проєктором."
        NSSupportsLiveActivities: true
        # Keeps the projector link while the app is in the background, so Lock Screen buttons answer at once.
        UIBackgroundModes: [bluetooth-central]
        CFBundleURLTypes:
          - CFBundleURLName: ua.beamdeck.remote
            CFBundleURLSchemes: [beamdeck]

  BeamDeckWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - BeamDeckWidgets
      - BeamDeck/Shared/LiveRemote.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BEAMDECK_BUNDLE_ID).widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BeamDeck
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    info:
      path: BeamDeckWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
